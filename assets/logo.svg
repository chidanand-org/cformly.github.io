<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cformly">
  <!--
    Cformly brand mark — the "Filed C".
    White geometric C (disk masked by inner hole + right wedge) on a sky-blue
    gradient tile; a marigold dot in the opening = the filed/seal accent.
    Palette: #2A8AD6 -> #0B5394 tile, #FFFFFF C, #E69A2E accent.
  -->
  <defs>
    <linearGradient id="ctile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A8AD6"/>
      <stop offset="1" stop-color="#0B5394"/>
    </linearGradient>
    <mask id="Ccut">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="88" fill="black"/>
      <path d="M 256 256 L 378.6 153.2 A 160 160 0 0 1 378.6 358.8 Z" fill="black"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ctile)"/>
  <circle cx="256" cy="256" r="150" fill="#FFFFFF" mask="url(#Ccut)"/>
  <circle cx="372" cy="256" r="26" fill="#E69A2E"/>
</svg>
